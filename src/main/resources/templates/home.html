<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calda Bordalesa - Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f9f4;
            color: #0b3d0b;
        }

        header {
            background: #2d6a4f;
            padding: 1rem 2rem;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        p {
            color: #2d6a4f;
            font-size: 1.1rem;
            line-height: 1.5rem;
        }

        .btn-group {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        a.btn {
            padding: 1rem;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            background: #40916c;
            color: white;
            transition: 0.2s;
        }

        a.btn:hover {
            background: #1b4332;
        }

        @media (min-width: 700px) {
            .btn-group {
                flex-direction: row;
                justify-content: center;
            }

            a.btn {
                width: 220px;
            }
        }
    </style>
</head>

<body>

<header>Calda Bordalesa</header>

<main class="container">
    <h1>Bem-vindo!</h1>
    <p>
        A calda bordalesa é uma mistura tradicional utilizada no controle de fungos em plantas.
        Escolha abaixo o que deseja fazer:
    </p>

    <div class="btn-group">
        <a href="/calcularCalda" class="btn">Calcular Calda</a>
        <a href="/all/plantas"class=" btn">Listar Plantas</a>
        <a href="/cadastrar" class="btn">Cadastrar Plantas</a>
    </div>
</main>

</body>
</html>
