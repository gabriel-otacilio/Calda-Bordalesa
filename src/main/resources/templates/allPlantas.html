<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plantas Cadastradas</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f9f4;
            color: #0b3d0b;
        }

        header {
            background: #2d6a4f;
            padding: 1rem 2rem;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 1rem;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        th, td {
            padding: 0.9rem;
            text-align: left;
            border-bottom: 1px solid #e5e5e5;
        }

        th {
            background-color: #40916c;
            color: white;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f1f8f4;
        }

        tr:hover {
            background-color: #e9f5ee;
        }

        .btn-voltar {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 1.4rem;
            background: #40916c;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-voltar:hover {
            background: #1b4332;
        }

        .vazio {
            padding: 1rem;
            color: #555;
        }
    </style>
</head>

<body>

<header>Calda Bordalesa</header>

<main class="container">
    <h1>Plantas Cadastradas</h1>

    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Conc. Máxima</th>
            <th>Conc. Mínima</th>
            <th>Descrição</th>
        </tr>
        </thead>

        <tbody>
        <!-- Percorre a lista enviada pelo controller -->
        <tr th:each="planta : ${plantas}">
            <td th:text="${planta.nome}">Nome</td>
            <td th:text="${planta.concentracaoMax}">0.0</td>
            <td th:text="${planta.concentracaoMin}">0.0</td>
            <td th:text="${planta.descricao}">Descrição</td>
        </tr>

        <!-- Caso a lista esteja vazia -->
        <tr th:if="${#lists.isEmpty(plantas)}">
            <td colspan="4" class="vazio">
                Nenhuma planta cadastrada.
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/" class="btn-voltar">⬅ Voltar para Home</a>
</main>

</body>
</html>
