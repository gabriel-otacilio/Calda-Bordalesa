<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Planta</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f9f4;
            color: #0b3d0b;
        }

        header {
            background: #2d6a4f;
            padding: 1rem 2rem;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 2.5rem auto;
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 1rem;
        }

        input {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #40916c;
        }

        button {
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.8rem;
            background: #40916c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1b4332;
        }

        .btn-voltar {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            text-decoration: none;
            color: #40916c;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>Calda Bordalesa</header>

<main class="container">
    <h1>Cadastrar Planta</h1>

    <form action="/cadastrar" method="post">

        <label>
            Nome:
            <input type="text" name="nome" required>
        </label>

        <label>
            Concentração Máxima:
            <input type="text" name="concentracaoMax" required>
        </label>

        <label>
            Concentração Mínima:
            <input type="text" name="concentracaoMin" required>
        </label>

        <label>
            Descrição:
            <input type="text" name="descricao">
        </label>

        <button type="submit">Cadastrar</button>
    </form>

    <a href="/" class="btn-voltar">⬅ Voltar para Home</a>
</main>

</body>
</html>
