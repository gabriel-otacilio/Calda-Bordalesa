<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Calda Bordalesa</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f9f4;
            color: #0b3d0b;
        }

        header {
            background: #2d6a4f;
            padding: 1rem 2rem;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 2.5rem auto;
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 1rem;
        }

        input {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #40916c;
        }

        button {
            width: 100%;
            margin-top: 1.8rem;
            padding: 0.8rem;
            background: #40916c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1b4332;
        }

        .btn-voltar {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            text-decoration: none;
            color: #40916c;
            font-weight: bold;

        }

        select {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #40916c;
        }

    </style>
</head>

<body>

<header>Calda Bordalesa</header>

<main class="container">
    <h1>Calcular Calda</h1>

    <form action="/calcularCalda" method="post">

        <label>
            Volume Total (litros):
            <input type="number" step="0.01" name="volumeTotal" required>
        </label>

        <label>
            Planta:
            <select name="idPlanta" required>
                <option value="">Selecione uma planta</option>
                <option th:each="planta : ${plantas}"
                        th:value="${planta.id}"
                        th:text="${planta.nome
                              + ' | Min: ' + planta.concentracaoMin
                              + ' | Max: ' + planta.concentracaoMax}">
                </option>
            </select>
        </label>

        <label style="margin-top: 1.2rem;">
            Concentração:
        </label>

        <label>
            <input type="radio" name="tipoConcentracao" value="MIN" required>
            Mínima
        </label>

        <label>
            <input type="radio" name="tipoConcentracao" value="MAX">
            Máxima
        </label>

        <button type="submit">Calcular</button>
    </form>

    <!--todo vou precisar de um java Script aqui pra adicionar a div com a receita-->
    <a href="/" class="btn-voltar">⬅ Voltar para Home</a>
</main>

</body>
</html>
