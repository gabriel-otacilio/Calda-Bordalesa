<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado - Receita da Calda</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f9f4;
            color: #0b3d0b;
        }

        header {
            background: #2d6a4f;
            padding: 1rem 2rem;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 2.5rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .info {
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        .info strong {
            color: #1b4332;
        }

        .receita {
            margin-top: 1.8rem;
            padding: 1.5rem;
            background: #d8f3dc;
            border-radius: 12px;
        }

        .receita h2 {
            margin-top: 0;
            text-align: center;
        }

        .item {
            font-size: 1.2rem;
            margin: 0.8rem 0;
            text-align: center;
            font-weight: bold;
        }

        .acoes {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            background: #40916c;
            color: white;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1b4332;
        }
    </style>
</head>

<body>

<header>Calda Bordalesa</header>

<main class="container">
    <h1>Receita da Calda</h1>

    <div class="info">
        <strong>Planta:</strong>
        <span th:text="${planta.nome}">Nome da Planta</span>
    </div>

    <div class="info">
        <strong>Descrição:</strong>
        <span th:text="${planta.descricao}">Descrição</span>
    </div>

    <div class="receita">
        <h2>Ingredientes</h2>

        <div class="item">
            💧 Água:
            <span th:text="${agua}">0</span> ml
        </div>

        <div class="item">
            🧪 Reagente(de cada):
            <span th:text="${reagente}">0</span> ml
        </div>
    </div>

    <div class="acoes">
        <a href="/calcularCalda" class="btn">Novo Cálculo</a>
        <a href="/" class="btn">Home</a>
    </div>
</main>

</body>
</html>
